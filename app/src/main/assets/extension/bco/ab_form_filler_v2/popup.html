<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A/B Form Filler</title>
<style>
body{font:14px Arial,sans-serif;width:330px;padding:14px;color:#222}h2{font-size:18px;margin:0 0 8px}
p{font-size:12px;line-height:1.45;color:#555}.btn{width:100%;padding:10px;margin:7px 0 0;border:0;border-radius:7px;background:#1769aa;color:white;font-weight:700;cursor:pointer}
.secondary{background:#555}#status{margin-top:10px;white-space:pre-wrap;font-size:12px;line-height:1.45}
label{display:block;margin:9px 0 4px;font-weight:600}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bbb;border-radius:6px}
</style></head><body>
<h2>A/B Form Filler</h2>
<p>Works on different websites. First try Auto Detect. If the page structure is unusual, set the two selectors manually. It fills fields only and never submits.</p>
<label for="limit">Maximum people (1–100)</label><input id="limit" type="number" min="1" max="100" value="100">
<button class="btn" id="detect">Auto Detect Form Groups</button>
<button class="btn" id="fill">Fill detected forms</button>
<button class="btn secondary" id="manualToggle">Manual selector settings</button>
<div id="manual" hidden>
<label for="row">One person's form/row selector</label><input id="row" placeholder=".person-row">
<label for="fields">11 text boxes selector inside each row</label><input id="fields" placeholder="input[type='text']">
<button class="btn secondary" id="save">Save selectors</button>
</div>
<div id="status">Open a page containing the forms, then click Auto Detect.</div>
<script src="popup.js"></script></body></html>
