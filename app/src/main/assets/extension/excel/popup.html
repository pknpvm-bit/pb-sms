<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      color: #202124;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #1a73e8;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #3c4043;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 5px;
      line-height: 1.4;
    }
    select {
      width: 100%;
      padding: 6px;
      border-radius: 5px;
      border: 1px solid #dadce0;
      font-size: 13px;
      background: #fff;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #188038;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #137333;
    }
    button:disabled {
      background-color: #9aa0a6;
      cursor: not-allowed;
    }
    #detectedInfo {
      font-size: 12px;
      color: #1967d2;
      background: #e8f0fe;
      padding: 6px 8px;
      border-radius: 5px;
      margin-bottom: 10px;
      display: none;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .unmatched-list {
      margin-top: 6px;
      max-height: 80px;
      overflow-y: auto;
      background: #fce8e6;
      color: #c5221f;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h3>📊 Excel / CSV Smart Marks Filler</h3>

  <div class="box">
    <label for="excelFile">১. আপনার Excel (.xlsx বা .csv) ফাইল দিন:</label>
    <input type="file" id="excelFile" accept=".xlsx, .csv, .txt" />
    <div class="hint">টিপস: সরাসরি <b>.xlsx</b> অথবা Excel থেকে <b>Save As &rarr; CSV</b> ফাইল দিন। (১ম কলাম: Name, পরের কলামগুলো: Subject)</div>
  </div>

  <div id="detectedInfo"></div>

  <div class="box" id="subjectBox" style="display:none;">
    <label for="subjectSelect">২. সাবজেক্ট (কলাম) নিশ্চিত করুন:</label>
    <select id="subjectSelect"></select>
  </div>

  <button id="fillBtn" disabled>নম্বর বসান (Fill Marks)</button>
  <div id="status"></div>

  <script src="xlsx-lite.js"></script>
  <script src="popup.js"></script>
</body>
</html>
