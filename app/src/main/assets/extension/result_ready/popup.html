<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RESULT READY TOOL</title>
  <style>
    body { font-family: Inter, 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; max-width: 440px; margin: 20px auto; box-shadow: 0 4px 12px rgba(15,23,42,0.06); }
    h2 { margin: 0 0 6px; font-size: 17px; color: #123b70; }
    p { margin: 0 0 14px; font-size: 13px; color: #475569; line-height: 1.5; }
    button { width: 100%; border: 0; border-radius: 10px; background: #15803d; color: #fff; padding: 12px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>RESULT READY TOOL</h2>
    <p>Extract Summative Evaluation marks directly from each student's View marksheet into a formatted Excel (.xlsx) result sheet.</p>
    <button id="openNativeBtn" type="button">Open Result Ready Tool</button>
  </div>
  <script>
    function launchNative() {
      try {
        if (window.BspAndroidBridge && window.BspAndroidBridge.notifyHubAction) {
          window.BspAndroidBridge.notifyHubAction('BSP_OPEN_RESULT_READY');
        } else {
          window.parent.postMessage({ type: 'BSP_OPEN_RESULT_READY' }, '*');
        }
      } catch (e) {}
    }
    document.getElementById('openNativeBtn').addEventListener('click', launchNative);
    setTimeout(launchNative, 50);
  </script>
</body>
</html>
