name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Enable BreakContinueInInlineLambdas
        run: |
          python3 - << 'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")
          snippet = '''
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile::class.java).configureEach {
              compilerOptions.freeCompilerArgs.add("-XXLanguage:+BreakContinueInInlineLambdas")
          }
          '''.strip() + "\n"

          content = gradle_file.read_text(encoding="utf-8")
          if "BreakContinueInInlineLambdas" not in content:
              gradle_file.write_text(content + "\n" + snippet, encoding="utf-8")
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
